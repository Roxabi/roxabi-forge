<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Introuvable — Roxabi Forge</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0e16">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/* STRUCTUREL — sans 404.html Pages traite le site en SPA et renvoie / sur tout chemin. */
:root {
  --bg:#0c0e16; --surface:#13161f; --border2:rgba(255,255,255,0.13);
  --text:#dde4f0; --text-dim:#7d8799; --text-xdim:#3e4556;
  --accent:#e8a030;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh; display: grid; place-items: center;
  font-family: var(--font); color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
main { max-width: 28rem; padding: 2rem 1.5rem; text-align: center; }
.kicker {
  font-family: var(--mono); font-size: .72rem;
  letter-spacing: .16em; text-transform: uppercase; color: var(--text-xdim);
}
h1 {
  font-weight: 700; letter-spacing: -0.02em;
  font-size: clamp(1.5rem, 4vw, 2rem); margin: 1rem 0 .75rem; line-height: 1.2;
}
h1 span { color: var(--accent); }
p { color: var(--text-dim); line-height: 1.5; font-size: .88rem; }
.btn {
  display: inline-flex; margin-top: 1.75rem; padding: .7rem 1.25rem;
  background: var(--surface); border: 1px solid var(--border2); border-radius: 8px;
  color: var(--text); text-decoration: none; font-weight: 500; font-size: .82rem;
  transition: border-color .15s, color .15s;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="kicker">404 · forge.roxabi.dev</div>
  <h1>Artefact <span>introuvable</span></h1>
  <p>Ce lien n’existe plus, ou le chemin est incorrect.</p>
  <a class="btn" href="/">Retour au catalogue</a>
</main>
</body>
</html>
